# .github/workflows/deploy.yml
# Deploy to GitHub Pages. Triggered only when CI passes on master.
# Gate: workflow_run waits for CI completion; conclusion=='success' blocks deploy on any failure.
# Vite config already sets base:'./' for GitHub Pages compatibility.

name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Clone and build peer library (@joverval/p2p-collab)
        run: |
          git clone https://github.com/joverval/p2p-collab.git ../p2p-collab
          cd ../p2p-collab
          npm ci
          npm run build
          npx tsc --emitDeclarationOnly

      - run: npm ci

      - name: Quick pre-deploy smoke
        run: |
          npm run typecheck
          node server/ws-relay.js &
          sleep 2
          curl -sf http://localhost:8083/healthz
          kill %1 2>/dev/null || true

      - run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5