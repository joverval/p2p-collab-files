# .github/workflows/deploy.yml
# Deploy to GitHub Pages. Triggered only when CI (test.yml) passes on master.
# Steps: clone peer library → npm ci → npm run build → configure-pages → upload → deploy
# All actions pinned to full commit SHA (supply-chain hardening).

name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Clone and build peer library (@joverval/p2p-collab)
        run: |
          git clone https://github.com/joverval/p2p-collab.git ../p2p-collab
          cd ../p2p-collab
          npm ci
          npm run build
          npx tsc --emitDeclarationOnly

      - run: npm ci

      - name: Quick pre-deploy smoke
        run: |
          npm run typecheck
          node server/ws-relay.js &
          sleep 2
          curl -sf http://localhost:8083/healthz
          kill %1 2>/dev/null || true

      - run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1