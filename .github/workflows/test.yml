# .github/workflows/test.yml
# CI pipeline for p2p-collab-files.
# Trigger: push to main, PRs against main.
# Steps: install -> typecheck -> unit tests + coverage -> build -> relay smoke -> E2E
# All actions pinned to full commit SHA (supply-chain hardening).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Clone and build peer library (@joverval/p2p-collab)
        run: |
          git clone https://github.com/joverval/p2p-collab.git ../p2p-collab
          cd ../p2p-collab
          npm ci
          npm run build
          npx tsc --emitDeclarationOnly

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Relay smoke test
        run: |
          node server/ws-relay.js &
          sleep 2
          curl -sf --retry 5 --retry-delay 1 http://localhost:8083/healthz
          echo "Relay /healthz OK"
          kill %1 2>/dev/null || true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (non-blocking)
        continue-on-error: true
        run: |
          node server/ws-relay.js &
          sleep 3
          npx playwright test
          PLAYWRIGHT_EXIT=$?
          kill %1 2>/dev/null || true
          exit $PLAYWRIGHT_EXIT

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
            coverage/